name: Validate published ar2 APK (runtime, emulator)

# Manual validation only: installs the EXACT published release APK on an
# Android emulator and captures runtime evidence. The published APK is
# unsigned, so for the emulator install ONLY it is test-signed with a
# throwaway debug key; both hashes are recorded and distinguished.
# Never builds product, never mutates the release.

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download published APK, verify hash, test-sign a copy
        run: |
          curl -sL -o cogo.apk "https://github.com/ahmed-qandil/code-on-the-go-arabic/releases/download/v26.46-ar2/CodeOnTheGo-v8-release-1115-1351.apk"
          echo "5b2439625b25a597834f3ce28e4cf6de19a180e90ff54f5442dd0ceefcb05bf5  cogo.apk" | sha256sum -c -
          echo "PUBLISHED unsigned sha256: $(sha256sum cogo.apk | cut -d' ' -f1)"
          keytool -genkeypair -v -keystore /tmp/test.keystore -alias test -keyalg RSA -keysize 2048 -validity 365 -storepass android -keypass android -dname "CN=Runtime Test Only" 2>/dev/null
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks /tmp/test.keystore --ks-pass pass:android --key-pass pass:android --out cogo-test-signed.apk cogo.apk
          echo "TEST-SIGNED copy sha256: $(sha256sum cogo-test-signed.apk | cut -d' ' -f1)"
          ls -la cogo.apk cogo-test-signed.apk

      - name: Install emulator host dependencies
        run: sudo apt-get update && sudo apt-get install -y libpulse0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 512M
          disk-size: 14G
          emulator-options: -no-window -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash ci/validate_ar2.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: evidence/
          retention-days: 14
