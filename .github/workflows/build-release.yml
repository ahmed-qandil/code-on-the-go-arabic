name: build-release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 26.46-ar2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch release-matched bundled assets (pinned to official 26.46 APK)
        run: |
          set -euo pipefail
          curl -fSL "https://download.appdevforall.org/CodeOnTheGo-release26.46-armv8a.apk" -o /tmp/official.apk
          python3 - <<'PY'
          import zipfile, hashlib, os, sys
          src = zipfile.ZipFile("/tmp/official.apk")
          # APK entry -> (destination, sha256, size) pinned to official 26.46 (ADFA-signed APK)
          assets = {
            "assets/database/documentation.db.br":        ("assets/release/common/database/documentation.db.br",        "4d6d2dd8e567e3736ef0a09249e7a8328eb35b3c0d2d9ac9a976acd03378626c", 67064753),
            "assets/data/common/localMvnRepository.zip.br":("assets/release/common/data/common/localMvnRepository.zip.br","854e78c9840e6995afa3f08d50c49aca1b1b431c6c34cf9ddc120aed5e7ff83f", 166597954),
            "assets/data/common/core.cgt.br":             ("assets/release/common/data/common/core.cgt.br",             "05163a8aff2a6ad48fcd9a06e9a9ab7258bc8fa4e7c0a65384cd294621550ce2", 535784),
            "assets/data/common/gradle-9.6.1-bin.zip.br": ("assets/release/common/data/common/gradle-9.6.1-bin.zip.br", "7271f18b3d50b5d81509a92c990fa1f114ebdd780cbfdae183e170f04ff658be", 61199108),
            "assets/data/common/gradle-api-9.6.1.jar.br": ("assets/release/common/data/common/gradle-api-9.6.1.jar.br", "658f53aee2c9f2128afe4048ea2f22762db80bb92c42e36d02e33be3616d77ed", 29524212),
            "assets/data/common/android-sdk.zip.br":      ("assets/release/v8/data/common/android-sdk.zip.br",          "def61720c755317db3d6d63d205bdd2a2917d68aa615a567c8062fc6c1d9911b", 64169266),
            "assets/data/common/bootstrap.zip.br":        ("assets/release/v8/data/common/bootstrap.zip.br",            "3495d2b1128d51c0acb1a59a98d9d0e8cf3d85721d21f4c35f7ff3e0f5289108", 99409138),
          }
          for entry, (dest, sha, size) in assets.items():
              data = src.read(entry)
              ok = len(data) == size and hashlib.sha256(data).hexdigest() == sha
              print(entry, "->", dest, len(data), "OK" if ok else "MISMATCH")
              if not ok:
                  sys.exit("pinned asset mismatch: " + entry)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              open(dest, "wb").write(data)
          print("all 7 pinned assets verified")
          PY

      - name: Build unsigned release APK (arm64 v8)
        run: ./gradlew :app:assembleV8Release -Pnext_release_version=$RELEASE_VERSION --stacktrace

      - name: Locate APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk")" >> "$GITHUB_OUTPUT"

      - name: Verify APK (unsigned, arm64-only, Arabic strings)
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          python3 - <<'PY'
          import zipfile, sys, os
          apk = os.environ["APK_PATH"]
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          sig = [n for n in names if n.startswith("META-INF/") and n.rsplit(".",1)[-1].upper() in ("RSA","SF","DSA","EC")]
          print("signature entries:", sig)
          assert not sig, "APK is signed!"
          abis = sorted({n.split("/")[1] for n in names if n.startswith("lib/")})
          print("ABIs:", abis)
          assert abis == ["arm64-v8a"], abis
          print("size MB:", len(open(apk,'rb').read())//1024//1024)
          PY

      - name: Package source zip
        run: git archive -o "code-on-the-go-arabic-$RELEASE_VERSION-source.zip" HEAD

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Code on the Go Arabic ${{ env.RELEASE_VERSION }}
          files: |
            ${{ steps.apk.outputs.path }}
            code-on-the-go-arabic-${{ env.RELEASE_VERSION }}-source.zip
