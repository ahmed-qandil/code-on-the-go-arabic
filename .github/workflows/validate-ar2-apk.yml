name: Validate published ar2 APK (runtime, emulator)

# Manual validation only: installs the EXACT published release APK on an
# Android emulator and captures runtime evidence (boot, locale ar-EG, install,
# launch, UI dumps, screenshots, extraction progress). Never builds product.

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download published APK and verify sha256
        run: |
          curl -sL -o cogo.apk "https://github.com/ahmed-qandil/code-on-the-go-arabic/releases/download/v26.46-ar2/CodeOnTheGo-v8-release-1115-1351.apk"
          echo "5b2439625b25a597834f3ce28e4cf6de19a180e90ff54f5442dd0ceefcb05bf5  cogo.apk" | sha256sum -c -
          ls -la cogo.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 512M
          disk-size: 14G
          emulator-options: -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -x
            mkdir -p evidence
            echo "" | base64 -d > /tmp/tap_text.py
            echo "dHJ5OgogICAgcyA9IG9wZW4oJy90bXAvd2luZG93LnhtbCcsIGVuY29kaW5nPSd1dGYtOCcpLnJlYWQoKQogICAgcHJpbnQoc3VtKDEgZm9yIGMgaW4gcyBpZiAn2IAnIDw9IGMgPD0gJ9u/JykpCmV4Y2VwdCBFeGNlcHRpb246CiAgICBwcmludCgwKQo=" | base64 -d > /tmp/count_ar.py
            adb root || true
            sleep 8
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 5; done
            adb shell setprop persist.sys.locale ar-EG
            adb shell settings put system system_locales ar-EG || true
            adb shell setprop ctl.restart zygote
            sleep 30
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 5; done
            adb shell settings get system system_locales
            adb shell getprop persist.sys.locale

            echo '=== install ==='
            adb install cogo.apk
            adb shell pm list packages | grep itsaky || echo 'PACKAGE NOT FOUND'
            adb shell dumpsys package com.itsaky.androidide | grep -E 'versionName|primaryCpuAbi' || true

            echo '=== launch ==='
            adb shell monkey -p com.itsaky.androidide -c android.intent.category.LAUNCHER 1
            sleep 20

            for i in $(seq 1 36); do
              adb exec-out screencap -p > evidence/shot-$i.png 2>/dev/null || true
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/window.xml /tmp/window.xml >/dev/null 2>&1 || true
              cp /tmp/window.xml evidence/ui-$i.xml 2>/dev/null || true
              AR=$(python3 /tmp/count_ar.py || echo 0)
              SIZE=$(adb shell du -s /data/data/com.itsaky.androidide 2>/dev/null | tr -d '\r' || true)
              echo "[$i] arabic_chars_in_ui=$AR appdata=$SIZE"
              python3 /tmp/tap_text.py || true
              sleep 30
            done

            adb shell pm path com.itsaky.androidide
            adb shell du -s /data/data/com.itsaky.androidide || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: evidence/
          retention-days: 14
